name: Add maize Kac benchmark

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-maize-kac-benchmark.yml"

permissions:
  contents: write

jobs:
  build-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ProtVisDatabase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Maize PeptideAtlas HR-HCD library
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 \
            --output /tmp/maize_hr_hcd.sptxt.gz \
            https://peptideatlas.org/builds/maize/202308/maize_2023-08_all_HR-HCD.sptxt.gz

      - name: Extract real internal-K acetylation benchmark
        shell: python
        run: |
          import gzip, re, os, csv, hashlib
          from pathlib import Path

          src = Path("/tmp/maize_hr_hcd.sptxt.gz")
          outdir = Path("inst/extdata/ptm/maize_kac")
          outdir.mkdir(parents=True, exist_ok=True)

          target_name = "VGYNPDK[Acetyl]IAFVPISGFEGDNMIER/3"
          entry = {}
          peaks = []
          in_peaks = False
          found = False

          def maybe_finish():
              global found
              if entry.get("Name") == target_name:
                  found = True
                  return True
              return False

          with gzip.open(src, "rt", errors="replace") as fh:
              for raw in fh:
                  line = raw.rstrip("\n")
                  if not line:
                      if maybe_finish():
                          break
                      entry = {}
                      peaks = []
                      in_peaks = False
                      continue
                  if in_peaks:
                      parts = re.split(r"\s+", line.strip(), maxsplit=2)
                      if len(parts) >= 2:
                          try:
                              mz = float(parts[0])
                              intensity = float(parts[1])
                          except ValueError:
                              continue
                          peaks.append((mz, intensity))
                      continue
                  if line.startswith("NumPeaks: "):
                      entry["NumPeaks"] = line.split(": ", 1)[1]
                      in_peaks = True
                      continue
                  if ": " in line:
                      key, value = line.split(": ", 1)
                      entry[key] = value
              else:
                  maybe_finish()

          if not found:
              raise SystemExit("Target K-acetylated spectrum was not found")
          if len(peaks) < 50:
              raise SystemExit(f"Unexpectedly few benchmark peaks: {len(peaks)}")

          comment = entry.get("Comment", "")
          precursor = float(entry["PrecursorMZ"])
          charge_match = re.search(r"/(\d+)$", entry["Name"])
          charge = int(charge_match.group(1)) if charge_match else 3

          def token(pattern, default=""):
              m = re.search(pattern, comment)
              return m.group(1) if m else default

          best_raw = token(r"\bBestRawSpectrum=([^ ]+)")
          probability = token(r"\bProb=([0-9.]+)")
          nreps = token(r"\bNreps=([^ ]+)")
          dot = token(r"\bDotConsensus=([^ ]+)")
          assigned = token(r"\bConsFracAssignedPeaks=([^ ]+)")
          collision = token(r"\bCollisionEnergy=([^ ]+)")
          proteins = token(r"\bProtein=([^ ]+)")
          pxd_ids = sorted(set(re.findall(r"PXD\d+", comment)))
          primary_protein = "Zm00001eb285220_P003"

          mgf = outdir / "maize_peptideatlas_kac_VGYNPDK_Acetyl.mgf"
          with mgf.open("w", newline="\n") as fh:
              fh.write("BEGIN IONS\n")
              fh.write("TITLE=MaizePeptideAtlas_2023-09_VGYNPDK[Acetyl]IAFVPISGFEGDNMIER/3\n")
              fh.write(f"PEPMASS={precursor:.6f}\n")
              fh.write(f"CHARGE={charge}+\n")
              fh.write(f"BESTRAWSPECTRUM={best_raw}\n")
              for mz, intensity in peaks:
                  fh.write(f"{mz:.6f} {intensity:.6f}\n")
              fh.write("END IONS\n")

          metadata = {
              "benchmark_id": "maize_kac_peptideatlas_2023_09",
              "dataset": "Maize PeptideAtlas 2023-09",
              "organism": "Zea mays",
              "peptide": "VGYNPDKIAFVPISGFEGDNMIER",
              "modified_peptide": "VGYNPDK[Acetyl]IAFVPISGFEGDNMIER",
              "modification": "N6-acetyl-L-lysine (Kac)",
              "modified_residue": "K",
              "modified_position": "7",
              "mass_shift_da": "42.010565",
              "precursor_mz": f"{precursor:.6f}",
              "precursor_charge": str(charge),
              "peptideatlas_probability": probability,
              "consensus_replicates": nreps,
              "consensus_dot": dot,
              "consensus_fraction_assigned_peaks": assigned,
              "collision_energy": collision,
              "best_raw_spectrum": best_raw,
              "primary_maize_protein": primary_protein,
              "protein_mappings": proteins,
              "supporting_pxd_ids": ";".join(pxd_ids),
              "library_entry": entry.get("FullName", entry.get("Name", "")),
              "library_num_peaks": str(len(peaks)),
              "peptideatlas_build": "https://peptideatlas.org/builds/maize/202308/",
              "source_library": "https://peptideatlas.org/builds/maize/202308/maize_2023-08_all_HR-HCD.sptxt.gz",
              "paper_doi": "10.1021/acs.jproteome.4c00320"
          }

          meta = outdir / "maize_peptideatlas_kac_VGYNPDK_Acetyl.tsv"
          with meta.open("w", newline="", encoding="utf-8") as fh:
              writer = csv.writer(fh, delimiter="\t", lineterminator="\n")
              writer.writerow(["field", "value"])
              for key, value in metadata.items():
                  writer.writerow([key, value])

          readme = outdir / "README.txt"
          readme.write_text(
              "ProtVis maize lysine-acetylation benchmark\n"
              "==========================================\n\n"
              "This benchmark is a real consensus HR-HCD spectrum extracted from the\n"
              "Maize PeptideAtlas 2023-09 build. The selected peptide contains one\n"
              "internal lysine acetylation: VGYNPDK[Acetyl]IAFVPISGFEGDNMIER (z=3).\n"
              "The full PeptideAtlas library is not bundled; only this single spectrum\n"
              "and its provenance metadata are installed with ProtVisDatabase.\n\n"
              "Source: Maize PeptideAtlas, DOI 10.1021/acs.jproteome.4c00320\n"
              f"Best raw spectrum: {best_raw}\n"
              f"Supporting ProteomeXchange IDs: {';'.join(pxd_ids)}\n",
              encoding="utf-8"
          )

          # Rebuild manifest entries for the three benchmark assets.
          manifest = Path("inst/extdata/manifest.tsv")
          rows = []
          with manifest.open("r", encoding="utf-8", newline="") as fh:
              reader = csv.DictReader(fh, delimiter="\t")
              fields = reader.fieldnames
              for row in reader:
                  if not row["path"].startswith("ptm/maize_kac/"):
                      rows.append(row)

          for path in (readme, mgf, meta):
              data = path.read_bytes()
              rows.append({
                  "path": path.relative_to("inst/extdata").as_posix(),
                  "category": "PTM benchmark",
                  "bytes": str(len(data)),
                  "sha256": hashlib.sha256(data).hexdigest()
              })

          rows.sort(key=lambda row: row["path"])
          with manifest.open("w", encoding="utf-8", newline="") as fh:
              writer = csv.DictWriter(
                  fh,
                  fieldnames=["path", "category", "bytes", "sha256"],
                  delimiter="\t",
                  lineterminator="\n"
              )
              writer.writeheader()
              writer.writerows(rows)

          desc = Path("DESCRIPTION")
          text = desc.read_text(encoding="utf-8")
          text, count = re.subn(
              r"(?m)^Version:\s*0\.1\.3\s*$",
              "Version: 0.1.4",
              text
          )
          if count != 1:
              raise SystemExit("Expected ProtVisDatabase version 0.1.3")
          desc.write_text(text, encoding="utf-8")

          print("Target:", entry.get("FullName"))
          print("Best raw spectrum:", best_raw)
          print("Supporting PXDs:", ",".join(pxd_ids))
          print("Peaks:", len(peaks))
          print("Probability:", probability, "Nreps:", nreps, "Dot:", dot, "Assigned:", assigned)

      - name: Validate benchmark assets
        shell: python
        run: |
          from pathlib import Path
          import csv, re
          root = Path("inst/extdata/ptm/maize_kac")
          mgf = (root / "maize_peptideatlas_kac_VGYNPDK_Acetyl.mgf").read_text()
          assert "BEGIN IONS" in mgf and "END IONS" in mgf
          assert "PEPMASS=904.110900" in mgf
          assert "CHARGE=3+" in mgf
          peak_lines = [
              line for line in mgf.splitlines()
              if re.match(r"^[0-9]+(?:\.[0-9]+)?\s+[0-9]+", line)
          ]
          assert len(peak_lines) == 150, len(peak_lines)

          rows = dict(
              csv.reader(
                  (root / "maize_peptideatlas_kac_VGYNPDK_Acetyl.tsv").open(),
                  delimiter="\t"
              )
          )
          assert rows["modified_peptide"] == "VGYNPDK[Acetyl]IAFVPISGFEGDNMIER"
          assert rows["modified_position"] == "7"
          assert rows["mass_shift_da"] == "42.010565"
          assert rows["peptideatlas_probability"] == "1.0000"

      - name: Commit benchmark and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/add-maize-kac-benchmark.yml
          git config user.name "liangfei"
          git config user.email "103125590+anhuikylin@users.noreply.github.com"
          git add DESCRIPTION inst/extdata/manifest.tsv inst/extdata/ptm/maize_kac .github/workflows/add-maize-kac-benchmark.yml
          git commit -m "Add maize K-acetylation benchmark"
          git push origin HEAD:main
